name: Anime Global News Scheduler

on:
  schedule:
    # Runs every 30 minutes (*:00 and *:30)
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests feedparser

      - name: Run Anime Bot
        run: |
          python anime_bot.py

      - name: Commit and Push History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_posts.txt || true
          git commit -m "Update sent anime posts history" || exit 0
          git push
